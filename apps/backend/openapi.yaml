components:
  schemas:
    PaymentTargetKind:
      type: string
      enum:
        - Lightning
        - Bitcoin
        - Cashu

    PaymentTarget:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/PaymentTargetKind'
        payload:
          type: object
          additionalProperties: true
      required:
        - kind
        - payload

    ScenarioStatus:
      type: string
      enum:
        - Pending
        - Analyzed
        - Decided
        - Executed
        - Failed

    Scenario:
      type: object
      properties:
        id:
          type: string
        target:
          $ref: '#/components/schemas/PaymentTarget'
        status:
          $ref: '#/components/schemas/ScenarioStatus'
        network:
          $ref: '#/components/schemas/SupportedNetwork'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - target
        - status
        - createdAt
        - updatedAt

    CreateScenarioRequest:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/PaymentTarget'
      required:
        - target

    ScenarioResponse:
      $ref: '#/components/schemas/Scenario'

    ListScenariosResponse:
      type: array
      items:
        $ref: '#/components/schemas/ScenarioResponse'

    UpdateScenarioStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ScenarioStatus'
      required:
        - status

    SupportedNetwork:
      type: string
      enum:
        - mainnet
        - testnet
        - testnet4
        - signet
        - regtest

    AppConfigResponse:
      type: object
      required:
        - network
        - updatedAt
      properties:
        network:
          $ref: '#/components/schemas/SupportedNetwork'
        updatedAt:
          type: string
          format: date-time

    UpdateNetworkRequest:
      type: object
      required:
        - network
      properties:
        network:
          $ref: '#/components/schemas/SupportedNetwork'

    TaintNodeType:
      type: string
      enum:
        - Address
        - Txid
        - Invoice
        - PaymentHash
        - Preimage
        - Pubkey
        - EventId
        - Mint
        - Relay
        - CashuToken

    TaintNode:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/TaintNodeType'
        value:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required:
        - id
        - type
        - value
        - metadata

    EvidenceItem:
      type: object
      properties:
        kind:
          type: string
          enum:
            - RawData
            - VerificationStep
            - Correlation
        ref:
          type: string
        description:
          type: string
        data:
          description: Additional evidence payload
      required:
        - kind
        - ref
        - description

    TaintEdge:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        relationship:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceItem'
      required:
        - id
        - from
        - to
        - relationship
        - confidence
        - evidence

    EvidencePath:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: string
        edges:
          type: array
          items:
            type: string
        overallConfidence:
          type: number
          minimum: 0
          maximum: 1
      required:
        - nodes
        - edges
        - overallConfidence

    FindPathsRequest:
      type: object
      properties:
        scenarioId:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]+$'
        fromNodeId:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]+$'
        toNodeId:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]+$'
        maxPaths:
          type: integer
          minimum: 1
      required:
        - scenarioId
        - fromNodeId
        - toNodeId

    FindPathsResponse:
      type: object
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/EvidencePath'
      required:
        - paths

    AnalyzeRequest:
      type: object
      properties:
        scenarioId:
          type: string
          pattern: '^[^\u0000-\u001F\u007F]+$'
        ingestData:
          $ref: '#/components/schemas/TaintIngestPayload'
        bitcoin:
          type: object
        lightning:
          type: object
        nostr:
          type: object
        cashu:
          type: object
      required:
        - scenarioId

    TaintIngestPayload:
      type: object
      properties:
        bitcoin:
          type: object
        lightning:
          type: object
        nostr:
          type: object
        cashu:
          type: object

    AnalyzeResponse:
      type: object
      properties:
        graph:
          $ref: '#/components/schemas/TaintGraph'
        scenarioId:
          type: string
        analyzedAt:
          type: string
          format: date-time
        ruleCount:
          type: integer
        nodeCount:
          type: integer
        edgeCount:
          type: integer
        pathCount:
          type: integer
      required:
        - graph
        - scenarioId
        - analyzedAt
        - ruleCount
        - nodeCount
        - edgeCount
        - pathCount

    TaintGraph:

      type: object
      properties:
        id:
          type: string
        scenarioId:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TaintNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/TaintEdge'
        paths:
          type: array
          items:
            $ref: '#/components/schemas/EvidencePath'
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - scenarioId
        - nodes
        - edges
        - paths
        - createdAt

    ClaimType:
      type: string
      enum:
        - Transaction
        - Nostr
        - Lightning
        - Routing
        - Privacy
        - Cashu

    Claim:
      type: object
      properties:
        text:
          type: string
        type:
          $ref: '#/components/schemas/ClaimType'
      required:
        - text
        - type

    RawDataRef:
      type: object
      properties:
        source:
          type: string
          enum:
            - Bitcoin
            - Lightning
            - Nostr
            - Cashu
        ref:
          type: string
        payload:
          description: Raw protocol payload
        fetchedAt:
          type: string
          format: date-time
      required:
        - source
        - ref
        - payload
        - fetchedAt

    VerificationStep:
      type: object
      properties:
        name:
          type: string
        endpoint:
          type: string
        input:
          description: Verification function input
        expected:
          description: Expected verification outcome
      required:
        - name
        - endpoint
        - input
        - expected

    EvidenceBundle:
      type: object
      properties:
        id:
          type: string
        claim:
          $ref: '#/components/schemas/Claim'
        rawDataRefs:
          type: array
          items:
            $ref: '#/components/schemas/RawDataRef'
        verificationSteps:
          type: array
          items:
            $ref: '#/components/schemas/VerificationStep'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        riskScore:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: 'null'
        bundleHash:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - claim
        - rawDataRefs
        - verificationSteps
        - confidence
        - riskScore
        - bundleHash
        - createdAt

    BuildClaimRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ClaimType'
        scenarioId:
          type: string
        input:
          description: Claim input payload
      required:
        - type
        - scenarioId
        - input

    VerifyClaimRequest:
      oneOf:
        - type: object
          properties:
            bundleId:
              type: string
            bundle:
              $ref: '#/components/schemas/EvidenceBundle'
          required:
            - bundle
        - $ref: '#/components/schemas/EvidenceBundle'

    VerifyClaimResponse:
      type: object
      properties:
        valid:
          type: boolean
        reason:
          type: string
        failedStep:
          type: string
        expected:
          type: string
        actual:
          type: string
      required:
        - valid
        - reason

    PolicyScope:
      type: string
      enum:
        - Read
        - Propose
        - Send
        - Publish

    PolicyResponse:
      type: object
      required:
        - id
        - dailyBudgetSats
        - perTxBudgetSats
        - scopes
        - allowedMints
        - allowedRelays
        - allowedEsplora
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        dailyBudgetSats:
          type: string
          pattern: '^[0-9]+$'
        perTxBudgetSats:
          type: string
          pattern: '^[0-9]+$'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/PolicyScope'
        allowedMints:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        allowedRelays:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        allowedEsplora:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        updatedAt:
          type: string
          format: date-time

    UpdatePolicyRequest:
      type: object
      required:
        - dailyBudgetSats
        - perTxBudgetSats
        - scopes
        - allowedMints
        - allowedRelays
        - allowedEsplora
      properties:
        dailyBudgetSats:
          type: string
          pattern: '^[0-9]+$'
        perTxBudgetSats:
          type: string
          pattern: '^[0-9]+$'
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PolicyScope'
        allowedMints:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        allowedRelays:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        allowedEsplora:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256

    ReadCheckRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          const: read

    ProposeCheckRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          const: propose

    SendCheckRequest:
      type: object
      required:
        - kind
        - amountSats
        - protocol
      properties:
        kind:
          type: string
          const: send
        amountSats:
          type: string
          pattern: '^[0-9]+$'
        protocol:
          type: string
          enum:
            - Bitcoin
            - Lightning
            - Cashu
        mint:
          type: string
          minLength: 1
          maxLength: 256

    PublishCheckRequest:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          const: publish

    CheckRequest:
      type: object
      oneOf:
        - $ref: '#/components/schemas/ReadCheckRequest'
        - $ref: '#/components/schemas/ProposeCheckRequest'
        - $ref: '#/components/schemas/SendCheckRequest'
        - $ref: '#/components/schemas/PublishCheckRequest'
      discriminator:
        propertyName: kind

    CheckResponse:
      type: object
      required:
        - allowed
        - limits
      properties:
        allowed:
          type: boolean
          const: true
        limits:
          type: object
          required:
            - dailyRemainingSats
            - perTxLimitSats
          properties:
            dailyRemainingSats:
              type: string
              pattern: '^[0-9]+$'
            perTxLimitSats:
              type: string
              pattern: '^[0-9]+$'

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            context:
              type: object
              additionalProperties: true
          required:
            - code
            - message
            - context
      required:
        - error

    BitcoinTxRequest:
      type: object
      required:
        - txid
      properties:
        txid:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 64-character lowercase hexadecimal transaction ID

    BitcoinAddressRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          pattern: '^(bc1|1|3|tb1|m|n|2|bcrt1)[a-zA-HJ-NP-Z0-9]+$'
          description: Bitcoin address

    BitcoinTxResponse:
      type: object
      required:
        - txid
        - version
        - locktime
        - size
        - weight
        - fee
        - status
        - inputs
        - outputs
      properties:
        txid:
          type: string
        version:
          type: integer
        locktime:
          type: integer
        size:
          type: integer
        weight:
          type: integer
        fee:
          type: string
        status:
          type: object
          required:
            - confirmed
          properties:
            confirmed:
              type: boolean
            blockHeight:
              type: [integer, 'null']
            blockHash:
              type: [string, 'null']
            blockTime:
              type: [integer, 'null']
        inputs:
          type: array
          items:
            type: object
            required:
              - txid
              - vout
              - isCoinbase
              - sequence
            properties:
              txid:
                type: string
              vout:
                type: integer
              prevout:
                type: [object, 'null']
                properties:
                  scriptpubkeyAddress:
                    type: [string, 'null']
                  scriptpubkeyType:
                    type: string
                  value:
                    type: string
              scriptsig:
                type: [string, 'null']
              witness:
                type: [array, 'null']
                items:
                  type: string
              isCoinbase:
                type: boolean
              sequence:
                type: integer
        outputs:
          type: array
          items:
            type: object
            required:
              - scriptpubkeyType
              - value
            properties:
              scriptpubkeyAddress:
                type: [string, 'null']
              scriptpubkeyType:
                type: string
              value:
                type: string

    BitcoinAddressResponse:
      type: object
      required:
        - address
        - chainStats
        - mempoolStats
      properties:
        address:
          type: string
        chainStats:
          type: object
          required:
            - fundedTxoCount
            - fundedTxoSum
            - spentTxoCount
            - spentTxoSum
            - txCount
          properties:
            fundedTxoCount:
              type: integer
            fundedTxoSum:
              type: string
            spentTxoCount:
              type: integer
            spentTxoSum:
              type: string
            txCount:
              type: integer
        mempoolStats:
          type: object
          required:
            - fundedTxoCount
            - fundedTxoSum
            - spentTxoCount
            - spentTxoSum
            - txCount

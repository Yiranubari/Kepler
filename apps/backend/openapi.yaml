openapi: 3.1.0
info:
  title: Kepler API
  version: 0.1.0
  description: Kepler agent wallet API with cross-protocol taint analysis and proof-carrying AI decisions.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - {}
paths:
  /api/scenarios:
    post:
      summary: Create a new payment scenario
      operationId: createScenario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioRequest'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          description: Invalid payment target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List all payment scenarios
      operationId: listScenarios
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of scenarios to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
          description: Number of scenarios to skip
        - name: network
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SupportedNetwork'
          description: Filter scenarios by Bitcoin network
      responses:
        '200':
          description: List of payment scenarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScenariosResponse'
        '400':
          description: Failed to retrieve scenarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/scenarios/{id}:
    get:
      summary: Get payment scenario by identifier
      operationId: getScenarioById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the scenario
      responses:
        '200':
          description: Scenario details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          description: Invalid scenario identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete payment scenario by identifier
      operationId: deleteScenario
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the scenario
      responses:
        '204':
          description: Scenario deleted successfully
        '400':
          description: Invalid scenario identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/scenarios/{id}/status:
    patch:
      summary: Update scenario status
      operationId: updateScenarioStatus
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScenarioStatusRequest'
      responses:
        '200':
          description: Updated scenario details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResponse'
        '400':
          description: Invalid status update request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/analyze:
    post:
      summary: Run cross-protocol taint analysis for a scenario
      operationId: analyzeScenario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '200':
          description: Taint analysis result generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          description: Failed to analyze scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /api/graph/{id}:
    get:
      summary: Get taint graph by identifier
      operationId: getGraphById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Taint graph details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaintGraph'
        '404':
          description: Graph not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/paths:
    post:
      summary: Find evidence paths between two nodes in a scenario
      operationId: findPaths
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindPathsRequest'
      responses:
        '200':
          description: Evidence paths found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindPathsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario graph not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/proof/build:
    post:
      summary: Build and persist an evidence bundle for a claim
      operationId: buildProofClaim
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildClaimRequest'
      responses:
        '200':
          description: Evidence bundle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceBundle'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Claim build or persistence error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/proof/verify:
    post:
      summary: Verify evidence bundle deterministically without AI
      operationId: verifyProofClaim
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyClaimRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyClaimResponse'
        '400':
          description: Invalid bundle or verification request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Verification error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/proof/scenario/{scenarioId}:
    get:
      summary: List all evidence bundles for a scenario
      operationId: listProofClaimsByScenario
      security: []
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the scenario
      responses:
        '200':
          description: Evidence bundles for the scenario
          content:
            application/json:
              schema:
                type: object
                required:
                  - bundles
                properties:
                  bundles:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidenceBundle'
        '400':
          description: Invalid scenario ID parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scenario not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/proof/{bundleHash}:
